[package]
name = "tiny"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.34"
bytes = "1.12.1"
thiserror = "2.0.19"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

mlua = { version = "0.12.0", features = [
    "luajit",
    "vendored",
    "anyhow",
    "macros",
    "serde",
] }

reqwest = { version = "0.13.4", features = ["json", "stream", "blocking"] }

base64 = "0.23.1"
utf16string = "0.2.0"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = { version = "0.11.11", features = ["auto-color", "humantime"] }
