[package]
name = "tiny"
version = "0.1.0"
edition = "2024"

[dependencies]

bytes = "1.12.1"
thiserror = "2.0.19"
anyhow = "1.0.104"

reqwest = { version = "0.13.4", features = ["json", "stream"] }
futures-util = "0.3.33"
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

mlua = { version = "0.12.0", features = [
    "luajit",
    "vendored",
    "async",
    "anyhow",
    "macros",
    "serde",
] }
log = "0.4.34"

ratatui = "0.30.2"
crossterm = "0.29.0"

async-trait = "0.1.92"
