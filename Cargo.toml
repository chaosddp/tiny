[package]
name = "tiny"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.19"
base64 = "0.23.1"
reqwest = { version = "0.13.4", features = ["json", "stream", "blocking"] }
mlua = { version = "0.12.0", features = [
    "luajit",
    "vendored",
    "anyhow",
    "macros",
    "serde",
    "send",
] }
serde = "1.0.229"
serde_json = "1.0.151"
glob = "0.3.4"
utf16string = "0.2.0"
log = "0.4.34"
bytes = "1.12.1"
sysinfo = "0.39.6"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = { version = "0.11.11", features = ["auto-color", "humantime"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
