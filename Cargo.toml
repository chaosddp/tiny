[package]
name = "tiny"
version = "0.1.0"
edition = "2024"

default-run = "tiny"

[dependencies]

bytes = "1.12.1"
thiserror = "2.0.19"
anyhow = "1.0.104"


serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

mlua = { version = "0.12.0", features = [
    "luajit",
    "vendored",
    "async",
    "anyhow",
    "macros",
    "serde",
] }

log = "0.4.34"


env_logger = { version = "0.11.11", features = ["auto-color", "humantime"] }


reqwest = { version = "0.13.4", features = ["json", "stream"] }
futures-util = { version = "0.3.33", optional = true }
tokio = { version = "1.53.1", features = ["full"], optional = true }
base64 = "0.23.1"
utf16string = "0.2.0"


[features]

default = ["sync"]
sync = ["reqwest/blocking"]
async = ["dep:futures-util", "dep:tokio"]
