<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/pico.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <title></title>
  <script type="module" src="/main.js" defer></script>
  <script src="js/alpinejs.min.js" defer></script>

</head>


<body>
  <main class="chat-container">
    <div x-data class="message-list" id="message-container">
      <template x-for="message in $store.session.messages" :key="message.id">
        <div>
          <div x-show="message.role == 'assistant'">
            <p>Assistant message:</p>
          </div>

          <div x-show="message.role == 'user'">
            <p>User message:</p>
          </div>

          <div x-show="message.role == 'assistant'" >
            <p class="msg-content" x-text="message.reasoning"></p>
          </div>
          <div>
            <p x-show="message.content && message.content.length > 0" class="msg-content" x-text="message.content"></p>
          </div>
        </div>
      </template>
    </div>

    <div class="form-wrapper">
      <form id="chat-form" class="input-bar">
        <input id="user-input" type="text" placeholder="enter message here" />
        <button type="submit" id="submit-btn" class="submmit-btn">Send</button>
      </form>
    </div>
  </main>
</body>

</html>
